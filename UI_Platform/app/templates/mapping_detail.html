{% extends "base.html" %}
{% block title %}Mapping: {{ mapping.name }}{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="section-navy mb-0">{{ mapping.name }}</h4>
  <a href="{{ url_for('visualization.workflow_overview') }}" class="btn btn-outline-secondary btn-sm">&larr; Back</a>
</div>

<div class="card mb-3">
  <div class="card-body">
    <iframe class="graph-frame" src="{{ url_for('static', filename=graph_path) }}"></iframe>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <h6 class="section-navy">Transformation Data Lineage</h6>
    <p class="lineage-table">{{ lineage|join(" &rarr; ")|safe }}</p>
  </div>
</div>

<div class="detail-panel" id="detailPanel">
  <div class="d-flex justify-content-between align-items-start mb-2">
    <h5 id="detailPanelTitle">Details</h5>
    <button class="btn-close" onclick="closeDetailPanel()"></button>
  </div>
  <div id="detailPanelBody"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/detail_panel.js') }}"></script>
<script>
  document.body.setAttribute("data-panel-mode", "transformation");
  document.body.setAttribute("data-mapping-name", "{{ mapping.name }}");
  // Graph nodes are keyed by INSTANCE name (needed for connector edges);
  // detail lookups need the underlying transformation/table name, so we
  // resolve instance -> {type, ref_name} client-side before fetching.
  window.MAPPING_INSTANCES = {
    {% for inst in mapping.instances %}"{{ inst.name }}": {type: "{{ inst.type }}", ref_name: "{{ inst.ref_name }}"}{% if not loop.last %},{% endif %}
    {% endfor %}
  };
</script>
{% endblock %}
